<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 360" role="img" aria-labelledby="title desc" font-family="Avenir Next, Avenir, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <title id="title">Kuration SDK</title>
  <desc id="desc">Kuration curates large gameplay datasets into training-ready data for world models. The gameplay module ships seven operators: join_video, pixel_shift, action_state_consistency, collision, slam_pipeline, slam_quality, and slam_motion_diversity.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"    stop-color="#171d2b"/>
      <stop offset="1"    stop-color="#273048"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#ff9505" stop-opacity="0.9"/>
      <stop offset="0.55" stop-color="#ff9505" stop-opacity="0.35"/>
      <stop offset="1"    stop-color="#ff9505" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="scanHighlight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#f8fafc" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#f8fafc" stop-opacity="0.14"/>
      <stop offset="1"   stop-color="#f8fafc" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1320" height="360" rx="28" fill="url(#bg)"/>

  <!-- Composition anchored left, plenty of whitespace right -->
  <g transform="translate(96,100)">
    <!-- Brand mark: the orange stylized K from the existing brand asset -->
    <path d="M0 12h26v62l58-62h34L63 69l60 79H90L45 88l-19 19v41H0z" fill="#ff9505">
      <animate attributeName="opacity" values="1;0.86;1" dur="4.4s" repeatCount="indefinite"/>
    </path>

    <!-- kuration wordmark -->
    <text x="150" y="86" fill="#f8fafc" font-size="86" font-weight="600" letter-spacing="-3.4">kuration</text>

    <!-- small SDK tag, monospace, orange -->
    <text x="548" y="42" fill="#ff9505" font-family="ui-monospace, 'SFMono-Regular', 'JetBrains Mono', Menlo, monospace" font-size="13" font-weight="700" letter-spacing="3">SDK</text>

    <!-- Tagline -->
    <text x="152" y="126" fill="#c7cbd4" font-size="21" font-weight="400" letter-spacing="0.01em">Curate large gameplay datasets for training world models.</text>

    <!-- Thin accent rule (fades to nothing on the right) -->
    <line x1="152" y1="156" x2="820" y2="156" stroke="url(#rule)" stroke-width="1.4"/>

    <!-- Seven operators as a single monospace row -->
    <text x="152" y="190" fill="#8892a3" font-family="ui-monospace, 'SFMono-Regular', 'JetBrains Mono', Menlo, monospace" font-size="13" font-weight="500" letter-spacing="0.06em">
      join_video &#160; · &#160; pixel_shift &#160; · &#160; action_state_consistency &#160; · &#160; collision
    </text>
    <text x="152" y="212" fill="#8892a3" font-family="ui-monospace, 'SFMono-Regular', 'JetBrains Mono', Menlo, monospace" font-size="13" font-weight="500" letter-spacing="0.06em">
      slam_pipeline &#160; · &#160; slam_quality &#160; · &#160; slam_motion_diversity
    </text>

    <!-- Subtle scanning highlight that reads across the operator list -->
    <rect x="152" y="178" width="220" height="42" rx="4" fill="url(#scanHighlight)">
      <animate attributeName="x" values="152;720;152" dur="8s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
