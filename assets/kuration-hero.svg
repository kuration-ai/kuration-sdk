<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 340" role="img" aria-labelledby="title desc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <title id="title">Kuration</title>
  <desc id="desc">Kuration curates large gameplay datasets into training-ready shards for world models</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#081420"/>
      <stop offset="1" stop-color="#0d2030"/>
    </linearGradient>
    <linearGradient id="shard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00d4ff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#00a8cc" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <rect width="1320" height="340" rx="24" fill="url(#bg)"/>

  <!-- Left: raw gameplay frames (a 3x3 grid, muted) -->
  <g transform="translate(120, 100)">
    <g opacity="0.55">
      <rect x="0"   y="0"   width="52" height="36" rx="4" fill="#16324a"/>
      <rect x="56"  y="0"   width="52" height="36" rx="4" fill="#1e3c56"/>
      <rect x="112" y="0"   width="52" height="36" rx="4" fill="#16324a"/>
      <rect x="0"   y="40"  width="52" height="36" rx="4" fill="#1e3c56"/>
      <rect x="56"  y="40"  width="52" height="36" rx="4" fill="#16324a"/>
      <rect x="112" y="40"  width="52" height="36" rx="4" fill="#1e3c56"/>
      <rect x="0"   y="80"  width="52" height="36" rx="4" fill="#16324a"/>
      <rect x="56"  y="80"  width="52" height="36" rx="4" fill="#1e3c56"/>
      <rect x="112" y="80"  width="52" height="36" rx="4" fill="#16324a"/>
    </g>
    <!-- tiny pixel hints suggesting gameplay -->
    <rect x="8"   y="8"  width="5" height="5" fill="#f87171" opacity="0.75"/>
    <rect x="18"  y="8"  width="5" height="5" fill="#4ade80" opacity="0.75"/>
    <rect x="118" y="48" width="5" height="5" fill="#00d4ff" opacity="0.75"/>
    <rect x="64"  y="88" width="5" height="5" fill="#f87171" opacity="0.75"/>
    <text x="82" y="150" text-anchor="middle" font-size="14" font-weight="500" fill="#7c8ea1" letter-spacing="0.03em">raw gameplay</text>
  </g>

  <!-- Dashed connector left -->
  <line x1="316" y1="160" x2="460" y2="160" stroke="#00d4ff" stroke-width="1.6" stroke-dasharray="4 6" opacity="0.55"/>

  <!-- Center: Kuration wordmark + tagline -->
  <g transform="translate(660, 170)">
    <text text-anchor="middle" font-size="90" font-weight="700" fill="#e6edf3" letter-spacing="-2">Kuration</text>
    <text text-anchor="middle" y="38" font-size="17" font-weight="400" fill="#7c8ea1" letter-spacing="0.02em">curate Physical AI datasets for training world models</text>
  </g>

  <!-- Dashed connector right -->
  <line x1="860" y1="160" x2="1004" y2="160" stroke="#00d4ff" stroke-width="1.6" stroke-dasharray="4 6" opacity="0.55"/>

  <!-- Right: selected training shards (fewer, highlighted, staggered) -->
  <g transform="translate(1080, 118)">
    <rect x="0"  y="28" width="68" height="50" rx="5" fill="url(#shard)" opacity="0.55"/>
    <rect x="18" y="14" width="68" height="50" rx="5" fill="url(#shard)" opacity="0.8"/>
    <rect x="36" y="0"  width="68" height="50" rx="5" fill="url(#shard)"/>
    <!-- verified check marks on front shard -->
    <rect x="48" y="10" width="6" height="6" fill="#4ade80"/>
    <rect x="60" y="10" width="6" height="6" fill="#4ade80"/>
    <rect x="72" y="16" width="6" height="6" fill="#4ade80"/>
    <text x="70" y="150" text-anchor="middle" font-size="14" font-weight="500" fill="#7c8ea1" letter-spacing="0.03em">training shards</text>
  </g>
</svg>
