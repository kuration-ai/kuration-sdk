# The heavy self-hosted matrices live in sibling workflows (ci-versions.yml,
# ci-integrations.yml, ci-integrations-minimum.yml, ci-core.yml) so no single
# run carries enough jobs for GitHub's /actions/runs/{id}/jobs response to
# exceed the ACA runner scaler's 3s HTTP timeout. See
# .github/aca-runner/ci-workflow-split-plan.md.
#
# `build` and `required-ci` deliberately stay here: publish.yml and
# publish-plugin.yml resolve the release artifact by querying this workflow
# file for a successful run at the release SHA, then downloading
# python-package-distributions-<sha> from it. Moving either out silently
# breaks releases.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  notebook-ui:
    name: JupyterLab and browser UX
    # Stays GitHub-hosted: `playwright install --with-deps` needs sudo apt-get,
    # and the aca-runner image runs as a non-root user without sudo rights.
    # Also builds and validates plugins/lab (kuration-lab) — the one plugin that
    # needs node/jlpm, so it is skipped by ci-core.yml's generic plugins job and
    # its release artifact is produced here instead.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install notebook and browser test runtimes
        run: >-
          python -m pip install '.[stats]' 'pytest>=8'
          'nbclient>=0.10' 'ipykernel>=6.29' 'playwright>=1.48,<2'
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Execute the model-free gameplay notebook
        run: >-
          python scripts/execute_notebook.py
          examples/notebooks/gameplay_stats.ipynb
          "$RUNNER_TEMP"/gameplay_stats.executed.ipynb
      - name: Exercise notebook-facing HTML in Chromium
        env:
          KURATION_BROWSER_TESTS: "1"
        run: python -m pytest tests/test_jupyter_ui.py -q
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Build the kuration-lab frontend
        run: |
          python -m pip install 'jupyterlab>=4.1,<5'
          # JupyterLab 4.5+ moved jlpm out into the separate jupyter_builder
          # distribution, so a partial install leaves a bin/jlpm that cannot
          # import it. Probe it here, where the traceback names the step, rather
          # than letting it surface from inside a hatch build hook.
          jlpm --version
          cd plugins/lab
          jlpm install
          jlpm build:prod
      - name: Build the kuration-lab distribution
        # Reuses the frontend built above through the jupyter-builder hook's
        # skip-if-exists, so neither the sdist nor the wheel shells out to jlpm.
        # Without it `python -m build` compiles from an sdist extracted into a
        # temp dir, where no frontend exists, and rebuilds it there.
        run: |
          python -m pip install 'build>=1.5,<2' 'twine>=6.2,<7' \
            'check-wheel-contents>=0.6.3,<1'
          python -m build --outdir lab-dist plugins/lab
          python -m twine check lab-dist/*
          check-wheel-contents lab-dist/*.whl
      - name: Install and smoke the lab extension
        run: |
          # Two reasons this hook must not run here. It cannot be skipped by
          # config: hatch-jupyter-builder honors skip-if-exists only for
          # version == "standard", so an editable install always reruns the npm
          # build whatever is on disk. And it cannot succeed: pip's build
          # isolation exports a PYTHONPATH whose sitecustomize strips the
          # interpreter's own site-packages, every child process inherits it,
          # and `jlpm` is a console script shebanged to that interpreter — so it
          # dies on `import jupyter_builder` even though jupyterlab is
          # installed. (`python -m build` is unaffected; it isolates with a venv
          # and clears PYTHONPATH.) The frontend step above already built it.
          SKIP_JUPYTER_BUILDER=1 python -m pip install -e 'plugins/lab[test]'
          jupyter labextension develop --overwrite plugins/lab
          jupyter labextension list 2>&1 | grep -q kuration-lab
          jupyter server extension list 2>&1 | grep -q kuration_lab
          python -m pytest plugins/lab/tests -q
          python -m ruff check plugins/lab/src plugins/lab/tests
          (cd lab-dist && sha256sum -- * > lab-SHA256SUMS)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: labextension-package-distributions-${{ github.sha }}
          path: lab-dist/
          if-no-files-found: error
          retention-days: 30

  platform-smoke:
    name: Core smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install . 'pytest>=8'
      - run: python -m pytest tests/test_schema.py tests/test_cli_discovery.py -q
      - run: kur-validate --help

  build:
    name: Build and wheel smoke test
    # `needs:` cannot span workflow files, so the gating that used to make this
    # wait for the full matrix now lives in required-ci, which fails the run if
    # any sibling workflow failed. The artifact this uploads is only ever
    # consumed from a *successful* ci.yml run, so a red matrix still cannot
    # promote a wheel.
    runs-on: [self-hosted, aca]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install pinned release tools
        run: >-
          python -m pip install -c .github/constraints/release.txt
          build setuptools twine check-wheel-contents
      - run: python -m build --no-isolation
      - name: Validate distribution metadata and contents
        run: |
          python -m twine check dist/*
          check-wheel-contents dist/*.whl
      - name: Smoke-test installed wheel
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP"/kuration-wheel-smoke
          "$RUNNER_TEMP"/kuration-wheel-smoke/bin/python -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP"/kuration-wheel-smoke/bin/python - <<'PY'
          from importlib.metadata import version
          from importlib.resources import files
          from pathlib import Path

          import kuration
          import kuration.core
          import kuration.gameplay

          package = files("kuration")
          core_package = files("kuration.core")
          assert core_package.joinpath("schemas/job.schema.json").is_file()
          assert package.joinpath("py.typed").is_file()
          assert "site-packages" in str(Path(kuration.__file__).resolve())
          assert kuration.__version__ == version("kuration-sdk")
          for name in ("inspect_dataset", "compare_datasets", "DatasetPreview",
                       "SelectionReview", "HoursSelectionReview", "QualityGateResult",
                       "render_html_report"):
              assert hasattr(kuration, name)
          assert kuration.core.Pipeline is kuration.Pipeline
          assert kuration.gameplay.SLAMReconstructor
          assert not hasattr(kuration.gameplay, "GameplayPipeline")
          assert not hasattr(kuration.gameplay, "as_gameplay")
          assert not hasattr(kuration.gameplay, "input")
          pipeline = kuration.input([{"t": 0.0, "x": 1.0}], time="t").window(1)
          assert type(pipeline) is kuration.Pipeline
          assert callable(pipeline.pixel_shift)
          assert callable(pipeline.slam_motion_diversity)
          assert "aintropy/pixel-shift" in kuration.default_registry.names("operator")
          assert "aintropy/action-state-consistency" in \
              kuration.default_registry.names("analyzer")
          assert "aintropy/slam-motion-diversity" in \
              kuration.default_registry.names("operator")
          PY
          while IFS= read -r command; do
            "$RUNNER_TEMP"/kuration-wheel-smoke/bin/"$command" --help
          done < <(
            "$RUNNER_TEMP"/kuration-wheel-smoke/bin/python - <<'PY'
          from importlib.metadata import distribution

          scripts = distribution("kuration-sdk").entry_points
          for entry_point in sorted(scripts, key=lambda item: item.name):
              if entry_point.group == "console_scripts":
                  print(entry_point.name)
          PY
          )
      - name: Record distribution hashes
        run: sha256sum dist/* > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions-${{ github.sha }}
          path: |
            dist/
            SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  required-ci:
    name: Required CI
    if: ${{ always() }}
    needs: [notebook-ui, platform-smoke, build]
    # GitHub-hosted on purpose: this job spends most of its life sleeping while
    # it waits on the sibling workflows, and should not hold an ACA slot.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - name: Verify jobs in this workflow
        env:
          NOTEBOOK_RESULT: ${{ needs.notebook-ui.result }}
          PLATFORM_RESULT: ${{ needs.platform-smoke.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          for result in "$NOTEBOOK_RESULT" "$PLATFORM_RESULT" "$BUILD_RESULT"; do
            test "$result" = success || exit 1
          done
      - name: Verify sibling CI workflows for this revision
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TRIGGER_EVENT: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          workflows="ci-versions.yml ci-integrations.yml ci-integrations-minimum.yml ci-core.yml"
          deadline=$(( $(date +%s) + 45 * 60 ))
          failed=0

          for workflow in $workflows; do
            while :; do
              # gh writes the error body to stdout, so a swallowed failure would
              # look like a run that is merely not ready. Check the exit status,
              # and only treat 404 (workflow not registered yet) as "keep going".
              if payload="$(gh api \
                    "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?head_sha=${HEAD_SHA}&per_page=30" \
                    2>&1)"; then
                line="$(printf '%s' "$payload" | jq -r "
                  [.workflow_runs[] | select(.event == \"${TRIGGER_EVENT}\")]
                  | sort_by(.run_number) | last // empty
                  | \"\(.status) \(.conclusion)\"")"
              elif printf '%s' "$payload" | grep -qi 'not found'; then
                line=""
              else
                echo "::error::could not query ${workflow}: ${payload}"
                exit 1
              fi

              run_status="${line%% *}"
              conclusion="${line##* }"

              if [ -z "$line" ]; then
                echo "${workflow}: no run yet for ${HEAD_SHA}, waiting"
              elif [ "$run_status" != "completed" ]; then
                echo "${workflow}: ${run_status}, waiting"
              else
                echo "${workflow}: ${conclusion}"
                break
              fi

              if [ "$(date +%s)" -ge "$deadline" ]; then
                echo "::error::timed out waiting for ${workflow} at ${HEAD_SHA}"
                exit 1
              fi
              sleep 20
            done

            if [ "$conclusion" != "success" ]; then
              echo "::error::${workflow} concluded ${conclusion} for ${HEAD_SHA}"
              failed=1
            fi
          done

          exit "$failed"
