name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev,methods,parquet,array,cloud,p2p]'
      - name: Test with coverage
        if: matrix.python == '3.11'
        run: python -m pytest tests/ -q --cov=kuration --cov-report=term --cov-report=xml --cov-fail-under=78
      - name: Test
        if: matrix.python != '3.11'
        run: python -m pytest tests/ -q
      - name: Upload coverage report
        if: matrix.python == '3.11'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage.xml
      - name: Compile
        if: matrix.python == '3.11'
        run: python -m compileall -q src/kuration examples
      - name: Lint
        if: matrix.python == '3.11'
        run: python -m ruff check src tests examples
      - name: Type check
        if: matrix.python == '3.11'
        run: python -m mypy
      - name: Run examples
        if: matrix.python == '3.11'
        run: |
          python examples/01_timeseries_to_shards.py
          python examples/02_robotics_action_aware.py
          python examples/03_compare_strategies.py
          python examples/04_operator_pipeline.py
          python examples/05_custom_operators.py

  minimum-dependencies:
    name: Minimum dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install declared minimums
        run: python -m pip install -c .github/constraints/minimum.txt -e '.[dev,methods,parquet,array,cloud,p2p]'
      - run: python -m pytest tests/ -q

  optional-integrations:
    name: Optional integration (${{ matrix.extra }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - extra: zarr
            smoke: import zarr
            tests: tests/test_adapters_tier1.py tests/test_check_source.py -k zarr
          - extra: torch
            smoke: import torch
            tests: tests/test_loaders.py -k torch
          - extra: hf
            smoke: import datasets
            tests: tests/test_adapters_tier1.py tests/test_check_source.py -k 'hf or huggingface'
          - extra: video
            smoke: import av; from kuration.media import _av; assert _av() is av
            tests: tests/test_media_transforms_execution.py -k 'video or pyav'
          - extra: ray
            smoke: import ray
            tests: tests/test_execution_backpressure.py -k ray
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install optional integration
        run: python -m pip install -e '.[dev,${{ matrix.extra }}]'
      - name: Import optional dependency
        run: python -c '${{ matrix.smoke }}'
      - name: Test optional integration
        env:
          RAY_memory_monitor_refresh_ms: "0"
        run: python -m pytest ${{ matrix.tests }} -q

  docs:
    name: Documentation site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e '.[docs]'
      - run: python -m mkdocs build --strict

  build:
    name: Build and wheel smoke test
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: python -m pip install 'build>=1.2'
      - run: python -m build
      - name: Smoke-test installed wheel
        shell: bash
        run: |
          python -m venv /tmp/kuration-wheel-smoke
          /tmp/kuration-wheel-smoke/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/kuration-wheel-smoke/bin/python - <<'PY'
          from importlib.metadata import version
          from importlib.resources import files
          from pathlib import Path

          import kuration

          package = files("kuration")
          assert package.joinpath("schemas/job.schema.json").is_file()
          assert package.joinpath("py.typed").is_file()
          assert "site-packages" in str(Path(kuration.__file__).resolve())
          assert kuration.__version__ == version("kuration-sdk")
          for name in ("inspect_dataset", "compare_datasets", "DatasetPreview",
                       "SelectionReview", "HoursSelectionReview", "QualityGateResult",
                       "render_html_report"):
              assert hasattr(kuration, name)
          PY
          for command in kur-curate kur-experiment kur-report kur-validate kur-list \
                         kur-describe kur-migrate kur-explain kur-inspect kur-diff kur-check; do
            /tmp/kuration-wheel-smoke/bin/"$command" --help
          done

  required-ci:
    name: Required CI
    if: ${{ always() }}
    needs: [test, minimum-dependencies, optional-integrations, docs, build]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        env:
          TEST_RESULT: ${{ needs.test.result }}
          MINIMUM_RESULT: ${{ needs.minimum-dependencies.result }}
          OPTIONAL_RESULT: ${{ needs.optional-integrations.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          for result in "$TEST_RESULT" "$MINIMUM_RESULT" "$OPTIONAL_RESULT" "$DOCS_RESULT" "$BUILD_RESULT"; do
            test "$result" = success || exit 1
          done
