name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev,methods,parquet,array,s3,gcs,azure,p2p]'
      - name: Import cloud backends
        if: matrix.python == '3.11'
        run: python -c 'import adlfs, gcsfs, s3fs'
      - name: Test with coverage
        if: matrix.python == '3.11'
        run: python -m pytest tests/ -q --cov=kuration --cov-report=term --cov-report=xml --cov-fail-under=78
      - name: Test
        if: matrix.python != '3.11'
        run: python -m pytest tests/ -q
      - name: Upload coverage report
        if: matrix.python == '3.11'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage.xml
      - name: Compile
        if: matrix.python == '3.11'
        run: python -m compileall -q src/kuration examples
      - name: Lint
        if: matrix.python == '3.11'
        run: python -m ruff check src tests examples
      - name: Type check
        if: matrix.python == '3.11'
        run: python -m mypy
      - name: Run examples
        if: matrix.python == '3.11'
        run: |
          python examples/01_timeseries_to_shards.py
          python examples/02_robotics_action_aware.py
          python examples/03_compare_strategies.py
          python examples/04_operator_pipeline.py
          python examples/05_custom_operators.py

  minimum-dependencies:
    name: Minimum dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install declared minimums
        run: python -m pip install -c .github/constraints/minimum.txt -e '.[dev,methods,parquet,array,s3,gcs,azure,p2p]'
      - name: Import minimum cloud backends
        run: python -c 'import adlfs, gcsfs, s3fs'
      - run: python -m pytest tests/ -q

  core-only:
    name: Core-only installation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install only the core and test runner
        run: python -m pip install . 'pytest>=8'
      - name: Verify heavy integrations remain optional
        run: |
          python - <<'PY'
          from importlib.util import find_spec

          for package in ("torch", "datasets", "zarr", "av", "ray", "s3fs", "gcsfs", "adlfs"):
              assert find_spec(package) is None, f"{package} leaked into the core installation"
          PY
      - name: Exercise core schemas and DSL
        run: python -m pytest tests/test_schema.py tests/test_grammar.py -q

  platform-smoke:
    name: Core smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install . 'pytest>=8'
      - run: python -m pytest tests/test_schema.py tests/test_cli_discovery.py -q
      - run: kur-validate --help

  optional-integrations:
    name: Optional integration (${{ matrix.extra }}, ${{ matrix.dependency_set }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        extra: [zarr, torch, hf, video, ray]
        dependency_set: [current, minimum]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install optional integration
        if: matrix.dependency_set == 'current'
        run: python -m pip install -e '.[dev,${{ matrix.extra }}]'
      - name: Install optional integration at its declared minimum
        if: matrix.dependency_set == 'minimum'
        run: python -m pip install -c .github/constraints/minimum.txt -e '.[dev,${{ matrix.extra }}]'
      - name: Import and test optional integration
        env:
          RAY_memory_monitor_refresh_ms: "0"
        shell: bash
        run: |
          case "${{ matrix.extra }}" in
            zarr)
              python -c 'import zarr'
              python -m pytest tests/test_adapters_tier1.py tests/test_check_source.py -k zarr -q
              ;;
            torch)
              python -c 'import torch'
              python -m pytest tests/test_loaders.py -k torch -q
              ;;
            hf)
              python -c 'import datasets'
              python -m pytest tests/test_adapters_tier1.py tests/test_check_source.py \
                -k 'hf or huggingface' -q
              ;;
            video)
              python -c 'import av; from kuration.media import _av; assert _av() is av'
              python -m pytest tests/test_media_transforms_execution.py -k 'video or pyav' -q
              ;;
            ray)
              python -c 'import ray'
              python -m pytest tests/test_execution_backpressure.py -k ray -q
              ;;
          esac

  docs:
    name: Documentation site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e '.[docs]'
      - run: python -m mkdocs build --strict

  plugins:
    name: Repository plugins
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Validate every plugin distribution in a clean environment
        shell: bash
        run: |
          mkdir -p plugin-dist
          for plugin in plugins/*; do
            test -f "$plugin/pyproject.toml" || continue
            venv="/tmp/kuration-plugin-$(basename "$plugin")"
            python -m venv "$venv"
            "$venv/bin/python" -m pip install -e . -e "$plugin[test]"
            "$venv/bin/python" -m pip check
            "$venv/bin/python" -m pytest "$plugin/tests" -q
            "$venv/bin/python" -m ruff check "$plugin/src" "$plugin/tests"
            "$venv/bin/python" -m build "$plugin"
            "$venv/bin/check-wheel-contents" "$plugin"/dist/*.whl
            "$venv/bin/python" -m pip install --force-reinstall --no-deps "$plugin"/dist/*.whl
            (
              cd /tmp
              "$venv/bin/python" -c \
                'from importlib.metadata import entry_points; assert entry_points().select(group="kuration.plugins")'
            )
            cp "$plugin"/dist/* plugin-dist/
          done
          sha256sum plugin-dist/* > plugin-SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugin-package-distributions-${{ github.sha }}
          path: |
            plugin-dist/
            plugin-SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  build:
    name: Build and wheel smoke test
    needs: [test, minimum-dependencies, core-only, platform-smoke, optional-integrations, docs,
            plugins]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Install pinned release tools
        run: >-
          python -m pip install -c .github/constraints/release.txt
          build setuptools twine check-wheel-contents
      - run: python -m build --no-isolation
      - name: Validate distribution metadata and contents
        run: |
          python -m twine check dist/*
          check-wheel-contents dist/*.whl
      - name: Smoke-test installed wheel
        shell: bash
        run: |
          python -m venv /tmp/kuration-wheel-smoke
          /tmp/kuration-wheel-smoke/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/kuration-wheel-smoke/bin/python - <<'PY'
          from importlib.metadata import version
          from importlib.resources import files
          from pathlib import Path

          import kuration

          package = files("kuration")
          assert package.joinpath("schemas/job.schema.json").is_file()
          assert package.joinpath("py.typed").is_file()
          assert "site-packages" in str(Path(kuration.__file__).resolve())
          assert kuration.__version__ == version("kuration-sdk")
          for name in ("inspect_dataset", "compare_datasets", "DatasetPreview",
                       "SelectionReview", "HoursSelectionReview", "QualityGateResult",
                       "render_html_report"):
              assert hasattr(kuration, name)
          PY
          for command in kur-curate kur-experiment kur-report kur-validate kur-list \
                         kur-describe kur-migrate kur-explain kur-inspect kur-diff kur-check; do
            /tmp/kuration-wheel-smoke/bin/"$command" --help
          done
      - name: Record distribution hashes
        run: sha256sum dist/* > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions-${{ github.sha }}
          path: |
            dist/
            SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  required-ci:
    name: Required CI
    if: ${{ always() }}
    needs: [test, minimum-dependencies, core-only, platform-smoke, optional-integrations, docs,
            plugins, build]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        env:
          TEST_RESULT: ${{ needs.test.result }}
          MINIMUM_RESULT: ${{ needs.minimum-dependencies.result }}
          CORE_RESULT: ${{ needs.core-only.result }}
          PLATFORM_RESULT: ${{ needs.platform-smoke.result }}
          OPTIONAL_RESULT: ${{ needs.optional-integrations.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          PLUGINS_RESULT: ${{ needs.plugins.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          for result in "$TEST_RESULT" "$MINIMUM_RESULT" "$CORE_RESULT" "$PLATFORM_RESULT" \
                        "$OPTIONAL_RESULT" "$DOCS_RESULT" "$PLUGINS_RESULT" "$BUILD_RESULT"; do
            test "$result" = success || exit 1
          done
