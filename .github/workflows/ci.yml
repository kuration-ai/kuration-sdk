name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev,methods,parquet,array,cloud,p2p]'
      - name: Test
        run: python -m pytest tests/ -q
      - name: Compile
        run: python -m compileall -q src/kuration examples
      - name: Lint
        run: python -m ruff check src tests examples
      - name: Type check
        run: python -m mypy
      - name: Build wheel and sdist
        run: python -m build
      - name: Run examples
        if: matrix.python == '3.11'
        run: |
          python examples/01_timeseries_to_shards.py
          python examples/02_robotics_action_aware.py
          python examples/03_compare_strategies.py
          python examples/04_operator_pipeline.py
