name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  prepare:
    name: Prepare tested distributions
    if: github.event_name == 'workflow_dispatch' || !startsWith(github.event.release.tag_name, 'plugin-')
    runs-on: [self-hosted, aca]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Require approved license metadata for a release
        if: github.event_name == 'release'
        run: |
          python - <<'PY'
          from pathlib import Path
          import tomllib

          with open("pyproject.toml", "rb") as handle:
              project = tomllib.load(handle)["project"]
          if not project.get("license"):
              raise SystemExit(
                  "release blocked: project.license is missing from pyproject.toml; "
                  "record the company-approved license before publishing"
              )
          authors = project.get("authors")
          if (
              not isinstance(authors, list)
              or not authors
              or any(
                  not isinstance(author, dict)
                  or not isinstance(author.get("name"), str)
                  or not author["name"].strip()
                  for author in authors
              )
          ):
              raise SystemExit(
                  "release blocked: project.authors must contain at least one approved "
                  "non-empty author name before publishing"
              )
          if not Path("LICENSE").is_file():
              raise SystemExit(
                  "release blocked: root LICENSE file is missing; add the text for the "
                  "company-approved project.license before publishing"
              )
          PY
      - name: Resolve source revision
        run: echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Verify release tag matches package version
        if: github.event_name == 'release'
        env:
          RELEASE_IS_PRERELEASE: ${{ github.event.release.prerelease }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib

          with open("pyproject.toml", "rb") as handle:
              package_version = tomllib.load(handle)["project"]["version"]
          tag_version = os.environ["RELEASE_TAG"].removeprefix("v")
          if tag_version != package_version:
              raise SystemExit(
                  f"release tag {tag_version!r} does not match package version {package_version!r}"
              )
          is_pep440_prerelease = re.search(
              r"(?:dev|alpha|beta|pre|preview|rc)\d*|(?:a|b|c)\d+",
              package_version.lower(),
          )
          if os.environ["RELEASE_IS_PRERELEASE"] == "false" and is_pep440_prerelease:
              raise SystemExit(
                  f"release {package_version!r} is a pre-release version; mark the GitHub "
                  "release as a prerelease so it cannot enter the final-only PyPI job"
              )
          PY
      - name: Download the successful CI build for this revision
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          run_id="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${RELEASE_SHA}&status=success&per_page=20" \
              --jq '[.workflow_runs[] | select(.event == "push")] | sort_by(.run_number) | last | .id // empty'
          )"
          if [ -z "$run_id" ]; then
            echo "No successful CI run exists for release revision ${RELEASE_SHA}." >&2
            echo "Wait for Required CI to pass, then re-run this workflow." >&2
            exit 1
          fi
          gh run download "$run_id" \
            --repo "$GITHUB_REPOSITORY" \
            --name "python-package-distributions-${RELEASE_SHA}" \
            --dir .
      - name: Install pinned release tools
        run: >-
          python -m pip install -c .github/constraints/release.txt
          build setuptools twine check-wheel-contents
      - name: Build distributions for a manual dry run
        if: github.event_name == 'workflow_dispatch'
        run: |
          python -m build --no-isolation
          sha256sum dist/* > SHA256SUMS
      - name: Verify distributions
        shell: bash
        run: |
          test "$(find dist -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -type f -name '*.tar.gz' | wc -l)" -eq 1
          sha256sum --check SHA256SUMS
          python -m twine check dist/*
          check-wheel-contents dist/*.whl
      - name: Smoke-test installed wheel
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP"/kuration-release-smoke
          "$RUNNER_TEMP"/kuration-release-smoke/bin/python -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP"/kuration-release-smoke/bin/python - <<'PY'
          from importlib.metadata import version
          from importlib.resources import files
          from pathlib import Path

          import kuration
          import kuration.core

          package = files("kuration")
          core_package = files("kuration.core")
          assert core_package.joinpath("schemas/job.schema.json").is_file()
          assert package.joinpath("py.typed").is_file()
          assert "site-packages" in str(Path(kuration.__file__).resolve())
          assert kuration.__version__ == version("kuration-sdk")
          PY
          while IFS= read -r command; do
            "$RUNNER_TEMP"/kuration-release-smoke/bin/"$command" --help
          done < <(
            "$RUNNER_TEMP"/kuration-release-smoke/bin/python - <<'PY'
          from importlib.metadata import distribution

          scripts = distribution("kuration-sdk").entry_points
          for entry_point in sorted(scripts, key=lambda item: item.name):
              if entry_point.group == "console_scripts":
                  print(entry_point.name)
          PY
          )
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-distributions-${{ github.run_id }}
          path: |
            dist/
            SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish and attach release artifacts
    if: github.event_name == 'release' && github.event.release.prerelease == false
    needs: prepare
    runs-on: [self-hosted, aca]
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/kuration-sdk
    permissions:
      actions: read
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-distributions-${{ github.run_id }}
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
      - name: Attach distributions and hashes to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/* SHA256SUMS --clobber
