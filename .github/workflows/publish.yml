name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade build
      - run: python -m build
      - name: Smoke-test distribution
        shell: bash
        run: |
          python -m venv /tmp/kuration-wheel-smoke
          /tmp/kuration-wheel-smoke/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/kuration-wheel-smoke/bin/python - <<'PY'
          from importlib.resources import files
          from pathlib import Path

          import kuration

          package = files("kuration")
          assert package.joinpath("schemas/job.schema.json").is_file()
          assert package.joinpath("py.typed").is_file()
          assert "site-packages" in str(Path(kuration.__file__).resolve())
          assert hasattr(kuration, "inspect_dataset")
          PY
          /tmp/kuration-wheel-smoke/bin/kur-inspect --help
      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/kuration-sdk
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
