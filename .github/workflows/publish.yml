name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Verify release tag matches package version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib

          with open("pyproject.toml", "rb") as handle:
              package_version = tomllib.load(handle)["project"]["version"]
          tag_version = os.environ["RELEASE_TAG"].removeprefix("v")
          if tag_version != package_version:
              raise SystemExit(
                  f"release tag {tag_version!r} does not match package version {package_version!r}"
              )
          PY
      - run: python -m pip install --upgrade build
      - run: python -m build
      - name: Record distribution hashes
        run: sha256sum dist/* | tee SHA256SUMS
      - name: Smoke-test distribution
        shell: bash
        run: |
          python -m venv /tmp/kuration-wheel-smoke
          /tmp/kuration-wheel-smoke/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/kuration-wheel-smoke/bin/python - <<'PY'
          from importlib.metadata import version
          from importlib.resources import files
          from pathlib import Path

          import kuration

          package = files("kuration")
          assert package.joinpath("schemas/job.schema.json").is_file()
          assert package.joinpath("py.typed").is_file()
          assert "site-packages" in str(Path(kuration.__file__).resolve())
          assert kuration.__version__ == version("kuration-sdk")
          for name in ("inspect_dataset", "compare_datasets", "DatasetPreview",
                       "SelectionReview", "HoursSelectionReview", "QualityGateResult",
                       "render_html_report"):
              assert hasattr(kuration, name)
          PY
          for command in kur-curate kur-experiment kur-report kur-validate kur-list \
                         kur-describe kur-migrate kur-explain kur-inspect kur-diff kur-check; do
            /tmp/kuration-wheel-smoke/bin/"$command" --help
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: |
            dist/
            SHA256SUMS

  publish:
    if: github.event_name == 'release' && github.event.release.prerelease == false
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/kuration-sdk
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          packages-dir: dist/
