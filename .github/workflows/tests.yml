name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for kuration-sdk access token
        id: gate
        env:
          TOKEN: ${{ secrets.KURATION_SDK_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "run_tests=false" >> $GITHUB_OUTPUT
            echo "::notice::Skipping tests. Set the KURATION_SDK_TOKEN repo secret to enable CI (PAT with read access to aintropy-ai/kuration-sdk). See CONTRIBUTING.md."
          else
            echo "run_tests=true" >> $GITHUB_OUTPUT
          fi

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run_tests == 'true'
        with:
          python-version: "3.13"

      - name: Install kuration-sdk + kuration-ai
        if: steps.gate.outputs.run_tests == 'true'
        env:
          TOKEN: ${{ secrets.KURATION_SDK_TOKEN }}
        run: |
          python -m pip install --upgrade pip
          pip install "kuration-sdk[methods,parquet] @ git+https://$TOKEN@github.com/aintropy-ai/kuration-sdk.git"
          pip install -e .[dev]

      - name: Run tests
        if: steps.gate.outputs.run_tests == 'true'
        run: pytest tests/ -q
