name: Publish plugin to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      plugin:
        description: "Plugin directory name under plugins/"
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare plugin distribution
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'plugin-')
    runs-on: [self-hosted, aca]
    timeout-minutes: 15
    outputs:
      package: ${{ steps.plugin.outputs.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Resolve and validate plugin
        id: plugin
        env:
          DISPATCH_PLUGIN: ${{ inputs.plugin }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          IS_RELEASE: ${{ github.event_name == 'release' }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import re
          import tomllib

          if os.environ["IS_RELEASE"] == "true":
              match = re.fullmatch(r"plugin-([a-z0-9_-]+)-v(.+)", os.environ["RELEASE_TAG"])
              if not match:
                  raise SystemExit("plugin release tags must be plugin-<directory>-v<version>")
              plugin, tag_version = match.groups()
              if plugin.startswith("_"):
                  raise SystemExit("underscore-prefixed plugin templates are not publishable")
          else:
              plugin, tag_version = os.environ["DISPATCH_PLUGIN"], None
              if not re.fullmatch(r"[a-z0-9_-]+", plugin):
                  raise SystemExit("plugin input must be one plugins/ directory name")
          path = Path("plugins") / plugin
          with open(path / "pyproject.toml", "rb") as handle:
              project = tomllib.load(handle)["project"]
          if tag_version is not None and tag_version != project["version"]:
              raise SystemExit(
                  f"release version {tag_version!r} does not match {project['version']!r}"
              )
          if os.environ["IS_RELEASE"] == "true":
              if not project.get("license") or not Path("LICENSE").is_file():
                  raise SystemExit(
                      "plugin release blocked until approved license metadata and LICENSE exist"
                  )
              prerelease = re.search(
                  r"(?:dev|alpha|beta|pre|preview|rc)\d*|(?:a|b|c)\d+",
                  project["version"].lower(),
              )
              if os.environ["IS_PRERELEASE"] == "false" and prerelease:
                  raise SystemExit("a PEP 440 prerelease must use a GitHub prerelease")
          # A package.json marks a browser-facing (labextension) plugin: its tested
          # artifact comes from ci.yml's notebook-ui job, its build needs node, and it
          # deliberately registers no kuration.plugins entry point.
          kind = "labextension" if (path / "package.json").is_file() else "component"
          with open(os.environ["GITHUB_ENV"], "a") as output:
              prefix = re.sub(r"[-_.]+", "_", project["name"]).lower()
              output.write(
                  f"PLUGIN_DIR={path}\nPLUGIN_PACKAGE={project['name']}\n"
                  f"PLUGIN_PREFIX={prefix}\nPLUGIN_VERSION={project['version']}\n"
                  f"PLUGIN_KIND={kind}\n"
              )
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"package={project['name']}\n")
          PY
      - name: Resolve source revision
        run: echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Download the successful CI plugin builds for this revision
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          run_id="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${RELEASE_SHA}&status=success&per_page=20" \
              --jq '[.workflow_runs[] | select(.event == "push")] | sort_by(.run_number) | last | .id // empty'
          )"
          if [ -z "$run_id" ]; then
            echo "No successful CI run exists for release revision ${RELEASE_SHA}." >&2
            echo "Wait for Required CI to pass, then re-run this workflow." >&2
            exit 1
          fi
          if [ "$PLUGIN_KIND" = "labextension" ]; then
            gh run download "$run_id" \
              --repo "$GITHUB_REPOSITORY" \
              --name "labextension-package-distributions-${RELEASE_SHA}" \
              --dir tested
            (cd tested && sha256sum --check lab-SHA256SUMS)
          else
            gh run download "$run_id" \
              --repo "$GITHUB_REPOSITORY" \
              --name "plugin-package-distributions-${RELEASE_SHA}" \
              --dir tested
            (cd tested && sha256sum --check plugin-SHA256SUMS)
          fi
      - name: Install pinned release tools
        run: |
          python -m pip install -c .github/constraints/release.txt \
            build setuptools twine check-wheel-contents
      - name: Select this plugin's tested distributions
        if: github.event_name == 'release'
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import shutil

          root = Path("tested")
          prefix = f"{os.environ['PLUGIN_PREFIX']}-{os.environ['PLUGIN_VERSION']}"
          wheels = [path for path in root.rglob("*.whl") if path.name.startswith(prefix + "-")]
          sdists = [path for path in root.rglob("*.tar.gz") if path.name == prefix + ".tar.gz"]
          if len(wheels) != 1 or len(sdists) != 1:
              raise SystemExit(
                  f"expected one tested wheel and sdist for {prefix}, got {wheels!r}, {sdists!r}"
              )
          destination = Path("dist")
          destination.mkdir()
          for path in (*wheels, *sdists):
              shutil.copy2(path, destination / path.name)
          PY
          sha256sum dist/* > SHA256SUMS
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        if: github.event_name == 'workflow_dispatch' && env.PLUGIN_KIND == 'labextension'
        with:
          node-version: "22"
      - name: Build distributions for a manual dry run
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "$PLUGIN_KIND" = "labextension" ]; then
            # A labextension build pulls its own backend (hatchling + jupyter-builder)
            # and runs jlpm, so it uses an isolated build instead of the release pins.
            python -m pip install 'jupyterlab>=4.1,<5'
            python -m build --outdir dist "$PLUGIN_DIR"
          else
            python -m build --no-isolation --outdir dist "$PLUGIN_DIR"
          fi
          sha256sum dist/* > SHA256SUMS
      - name: Validate distributions
        run: |
          test "$(find dist -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -type f -name '*.tar.gz' | wc -l)" -eq 1
          sha256sum --check SHA256SUMS
          python -m twine check dist/*
          check-wheel-contents dist/*.whl
      - name: Smoke-test installed plugin wheel
        run: |
          python -m venv "$RUNNER_TEMP"/kuration-plugin-release-smoke
          "$RUNNER_TEMP"/kuration-plugin-release-smoke/bin/python -m pip install . dist/*.whl
          if [ "$PLUGIN_KIND" = "labextension" ]; then
            # UI distribution: prove both extension surfaces are discoverable instead of
            # the kuration.plugins entry point it deliberately does not register.
            "$RUNNER_TEMP"/kuration-plugin-release-smoke/bin/python -m pip install 'jupyterlab>=4.1,<5'
            cd "$RUNNER_TEMP"
            "$RUNNER_TEMP"/kuration-plugin-release-smoke/bin/jupyter labextension list 2>&1 \
              | grep -q kuration-lab
            "$RUNNER_TEMP"/kuration-plugin-release-smoke/bin/jupyter server extension list 2>&1 \
              | grep -q kuration_lab
          else
            cd "$RUNNER_TEMP"
            "$RUNNER_TEMP"/kuration-plugin-release-smoke/bin/python - <<'PY'
          import os
          from importlib.metadata import entry_points, version

          assert version(os.environ["PLUGIN_PACKAGE"])
          points = entry_points().select(group="kuration.plugins")
          assert points, "installed plugin wheel exposes no kuration.plugins entry point"
          for point in points:
              target = point.load()
              if callable(target):
                  target()
          PY
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugin-release-distributions-${{ github.run_id }}
          path: |
            dist/
            SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish plugin distribution
    if: github.event_name == 'release' && github.event.release.prerelease == false && startsWith(github.event.release.tag_name, 'plugin-')
    needs: prepare
    runs-on: [self-hosted, aca]
    timeout-minutes: 10
    environment:
      name: pypi-plugins
      url: https://pypi.org/p/${{ needs.prepare.outputs.package }}
    permissions:
      actions: read
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: plugin-release-distributions-${{ github.run_id }}
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
      - name: Attach distributions and hashes to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/* SHA256SUMS --clobber
