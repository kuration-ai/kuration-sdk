[project]
name = "kuration-plugin-slam"
version = "0.1.0"
description = "Kuration integration for curating video with precomputed SLAM trajectories."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "kuration-sdk>=0.1.0rc3",
    "numpy>=1.24",
]

[project.optional-dependencies]
video = ["kuration-sdk[video]>=0.1.0rc3"]
test = [
    "pytest>=8",
    "ruff>=0.5",
    "build>=1.5,<2",
    "check-wheel-contents>=0.6.3,<1",
]

[project.entry-points."kuration.plugins"]
slam = "kuration_slam:register"

[build-system]
requires = ["setuptools>=80,<84"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
