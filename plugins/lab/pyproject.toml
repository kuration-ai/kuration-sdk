[project]
name = "kuration-lab"
version = "0.1.0"
description = "JupyterLab extension for the kuration SDK: author, run, and inspect curation jobs."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "kuration-sdk[stats]>=0.1.0rc5.dev0,<0.2",
    "jupyter-server>=2.14,<3",
]
classifiers = [
    "Framework :: Jupyter",
    "Framework :: Jupyter :: JupyterLab",
    "Framework :: Jupyter :: JupyterLab :: 4",
    "Framework :: Jupyter :: JupyterLab :: Extensions",
    "Framework :: Jupyter :: JupyterLab :: Extensions :: Prebuilt",
    "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-jupyter[server]>=0.10",
    "ruff>=0.5",
    "build>=1.5,<2",
    "check-wheel-contents>=0.6.3,<1",
    "jupyterlab>=4.1,<5",
]

[build-system]
requires = ["hatchling>=1.21", "hatch-jupyter-builder>=0.8.3"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
artifacts = ["src/kuration_lab/labextension"]
exclude = [".github", "node_modules", "lib", "dist"]

[tool.hatch.build.targets.wheel]
packages = ["src/kuration_lab"]

[tool.hatch.build.targets.wheel.shared-data]
"src/kuration_lab/labextension" = "share/jupyter/labextensions/kuration-lab"
"install.json" = "share/jupyter/labextensions/kuration-lab/install.json"
"jupyter-config/server-config" = "etc/jupyter/jupyter_server_config.d"

[tool.hatch.build.hooks.jupyter-builder]
dependencies = ["hatch-jupyter-builder>=0.8.3"]
build-function = "hatch_jupyter_builder.npm_builder"
ensured-targets = [
    "src/kuration_lab/labextension/static/style.js",
    "src/kuration_lab/labextension/package.json",
]
skip-if-exists = ["src/kuration_lab/labextension/static/style.js"]

[tool.hatch.build.hooks.jupyter-builder.build-kwargs]
build_cmd = "build:prod"
npm = ["jlpm"]

[tool.check-wheel-contents]
ignore = ["W002"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
