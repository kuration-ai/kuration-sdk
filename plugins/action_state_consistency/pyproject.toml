[project]
name = "kuration-plugin-action-state-consistency"
version = "0.1.0"
description = "Kuration anomaly-detection operator; the action_state type checks measured pixel shift against user-supplied consistency baselines."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "kuration-sdk>=0.1.0rc2",
    "numpy>=1.24",
]

# The generic anomaly_checker core has no pixel_shift dependency at all -- only the
# action_state anomaly type does, and only when actually invoked (see action_state.py's
# module docstring). Installing this package alone never requires pixel_shift.
[project.optional-dependencies]
action_state = ["kuration-plugin-pixel-shift>=0.1.0"]
test = [
    "kuration-plugin-pixel-shift>=0.1.0",
    "pytest>=8",
    "ruff>=0.5",
    "build>=1.5,<2",
    "check-wheel-contents>=0.6.3,<1",
]

[build-system]
requires = ["setuptools>=80,<84"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E401", "E402", "E731", "F401"]
