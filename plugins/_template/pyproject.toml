[project]
name = "kuration-plugin-template"
version = "0.1.0"
description = "Copyable template for a separately packaged Kuration plugin."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["kuration-sdk>=0.1.0rc5.dev0,<0.2"]

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.5", "build>=1.5,<2", "check-wheel-contents>=0.6.3,<1"]

[project.entry-points."kuration.plugins"]
template = "kuration_plugin_template:register"

[build-system]
requires = ["setuptools>=80,<84"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
