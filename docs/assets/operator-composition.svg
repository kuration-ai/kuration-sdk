<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 290" role="img" aria-labelledby="title desc">
  <title id="title">Operator composition</title>
  <desc id="desc">A named operator validates parameters and expands into ordinary measures, transforms, filters, and bins with provenance.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0l10 5-10 5z" fill="#cc5803"/></marker></defs>
  <rect width="1100" height="290" rx="24" fill="#fbf9f5" stroke="#dfe1e6"/>
  <g font-family="Inter,ui-sans-serif,system-ui,sans-serif">
    <g transform="translate(38 64)"><rect width="220" height="150" rx="18" fill="#fff4df" stroke="#ffc971"/><text x="24" y="36" fill="#9f3f00" font-size="17" font-weight="700">NAMED OPERATOR</text><text x="24" y="67" fill="#273048" font-size="14">acme/range-diversity</text><rect x="22" y="88" width="176" height="38" rx="10" fill="#ffdfaa"/><text x="110" y="112" text-anchor="middle" fill="#7a2e00" font-size="13">validated parameters</text></g>
    <path d="M270 139h75" stroke="#cc5803" stroke-width="3" marker-end="url(#a)"/>
    <g transform="translate(360 35)"><rect width="450" height="210" rx="20" fill="#edf0f5" stroke="#aeb6c5"/><text x="225" y="34" text-anchor="middle" fill="#273048" font-size="17" font-weight="700">ORDINARY PIPELINE EXPANSION</text><g transform="translate(25 65)" text-anchor="middle"><rect width="110" height="70" rx="13" fill="#fff" stroke="#c7cdd8"/><text x="55" y="31" fill="#273048" font-size="14">measure</text><text x="55" y="51" fill="#667085" font-size="12">or transform</text></g><path d="M145 100h35" stroke="#e2711d" stroke-width="2" marker-end="url(#a)"/><g transform="translate(190 65)" text-anchor="middle"><rect width="95" height="70" rx="13" fill="#fff" stroke="#c7cdd8"/><text x="47" y="42" fill="#273048" font-size="14">filter</text></g><path d="M295 100h35" stroke="#e2711d" stroke-width="2" marker-end="url(#a)"/><g transform="translate(340 65)" text-anchor="middle"><rect width="85" height="70" rx="13" fill="#fff" stroke="#c7cdd8"/><text x="42" y="42" fill="#273048" font-size="14">bin</text></g><text x="225" y="172" text-anchor="middle" fill="#667085" font-size="13">same validation · same execution · no hidden stage</text></g>
    <path d="M822 139h75" stroke="#cc5803" stroke-width="3" marker-end="url(#a)"/>
    <g transform="translate(912 64)"><rect width="150" height="150" rx="18" fill="#273048" stroke="#e2711d"/><text x="75" y="38" text-anchor="middle" fill="#ffc971" font-size="16" font-weight="700">PROVENANCE</text><text x="75" y="75" text-anchor="middle" fill="#f8fafc" font-size="13">named call</text><text x="75" y="99" text-anchor="middle" fill="#f8fafc" font-size="13">expansion</text><text x="75" y="123" text-anchor="middle" fill="#ffb627" font-size="13">fingerprint</text></g>
  </g>
</svg>
