<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Kuration pipeline</title>
  <desc id="desc">Sources become canonical ticks, candidate windows, measured features, a selected subset, and verified training shards.</desc>
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#e2711d"/><stop offset="1" stop-color="#273048"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#273048"/></marker>
  </defs>
  <rect width="1200" height="260" rx="24" fill="#fbf9f5" stroke="#dfe1e6"/>
  <path d="M188 112h67M402 112h67M616 112h67M830 112h67" stroke="url(#line)" stroke-width="4" marker-end="url(#arrow)"/>
  <g font-family="Inter,ui-sans-serif,system-ui,sans-serif" text-anchor="middle">
    <g transform="translate(32 54)"><rect width="156" height="116" rx="18" fill="#fff4df" stroke="#ffc971"/><text x="78" y="40" font-size="16" font-weight="700" fill="#9f3f00">SOURCES</text><text x="78" y="68" font-size="14" fill="#273048">files · rows · video</text><text x="78" y="91" font-size="13" fill="#667085">schema-aware input</text></g>
    <g transform="translate(246 54)"><rect width="156" height="116" rx="18" fill="#ffecd0" stroke="#ffb627"/><text x="78" y="40" font-size="16" font-weight="700" fill="#9f3f00">WINDOWS</text><text x="78" y="68" font-size="14" fill="#273048">segment · align</text><text x="78" y="91" font-size="13" fill="#667085">candidate pool</text></g>
    <g transform="translate(460 54)"><rect width="156" height="116" rx="18" fill="#edf0f5" stroke="#aeb6c5"/><text x="78" y="40" font-size="16" font-weight="700" fill="#273048">FEATURES</text><text x="78" y="68" font-size="14" fill="#273048">measure · transform</text><text x="78" y="91" font-size="13" fill="#667085">validated signals</text></g>
    <g transform="translate(674 54)"><rect width="156" height="116" rx="18" fill="#e3e7ee" stroke="#7b879d"/><text x="78" y="40" font-size="16" font-weight="700" fill="#273048">SELECTION</text><text x="78" y="68" font-size="14" fill="#273048">filter · bin · rank</text><text x="78" y="91" font-size="13" fill="#667085">count or hours</text></g>
    <g transform="translate(888 42)"><rect width="280" height="140" rx="20" fill="#273048" stroke="#e2711d"/><text x="140" y="39" font-size="16" font-weight="700" fill="#ffc971">DATASET ARTIFACT</text><text x="140" y="69" font-size="14" fill="#f8fafc">train/test shards · manifest</text><text x="140" y="93" font-size="14" fill="#f8fafc">resolved config · provenance</text><text x="140" y="119" font-size="13" fill="#ffb627">SHA-256 verified</text></g>
    <text x="600" y="224" font-size="14" fill="#667085">Deterministic decisions and identity are preserved from source to shard.</text>
  </g>
</svg>
