<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Kuration</title>
  <desc id="desc">Turn raw sequential data into selected, verified training datasets.</desc>
