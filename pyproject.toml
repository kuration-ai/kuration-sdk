[project]
name = "kuration-sdk"
version = "0.0.1"
description = "Dataset-agnostic curation SDK: raw source -> curated subset -> training shards."
requires-python = ">=3.11"
dependencies = ["numpy"]

# Domain knowledge never lives in the core; heavy capabilities are opt-in extras,
# lazily imported and loud-on-missing (the asg2diamond convention).
[project.optional-dependencies]
methods = ["scikit-learn>=1.4"]   # feature-space selection methods
parquet = ["pyarrow"]             # Parquet input adapter / output container
array = ["h5py"]                  # tensor shard container
cloud = ["fsspec"]                # gs:// / s3:// / az:// I/O (plus a backend: gcsfs/s3fs/adlfs)
torch = ["torch"]                 # PyTorch ShardDataset over a curated dataset (kuration.torch)
hf = ["datasets"]                 # HuggingFace datasets input adapter
zarr = ["zarr"]                   # Zarr array-store input adapter

[project.scripts]
kur-curate = "kuration.cli.curate:main"
kur-experiment = "kuration.cli.experiment:main"
kur-report = "kuration.cli.report:main"
kur-validate = "kuration.cli.validate:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["kuration*"]

[tool.setuptools.package-data]
kuration = ["schemas/*.json"]   # shipped JSON Schema for job/strategy specs (kur-validate)
