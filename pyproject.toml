[project]
name = "kuration-sdk"
version = "0.1.0"
description = "Dataset-agnostic curation SDK: raw source -> curated subset -> training shards."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]
keywords = ["dataset", "curation", "time-series", "data-selection", "shards", "training-data"]
license = "Apache-2.0"            # SPDX expression (PEP 639); the License classifier is superseded
license-files = ["LICENSE"]
authors = [
    { name = "Nirmit Desai", email = "nirmit.desai@aintropy.ai" },
    { name = "Eric Song", email = "eric.song@aintropy.ai" },
]
maintainers = [
    { name = "Nirmit Desai", email = "nirmit.desai@aintropy.ai" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/kuration-ai/kuration-sdk"
Documentation = "https://kuration-ai.github.io/kuration-sdk/"
Repository = "https://github.com/kuration-ai/kuration-sdk.git"
Issues = "https://github.com/kuration-ai/kuration-sdk/issues"
Changelog = "https://github.com/kuration-ai/kuration-sdk/blob/main/CHANGELOG.md"

# This evaluation build includes first-party domain operators in the SDK wheel while
# keeping their heavy runtime dependencies opt-in, lazy, and loud-on-missing.
[project.optional-dependencies]
methods = ["scikit-learn>=1.5"]   # feature-space selection methods
parquet = ["pyarrow>=23.0.1"]     # Parquet input adapter / output container
scale = ["pyarrow>=23.0.1"]       # Arrow IPC feature tables and bounded execution
array = ["h5py>=3.10"]            # tensor shard container
cloud = ["fsspec>=2026.6"]        # gs:// / s3:// / az:// I/O (plus a backend: gcsfs/s3fs/adlfs)
s3 = ["fsspec>=2026.6", "s3fs>=2026.6"]      # s3:// I/O
gcs = ["fsspec>=2026.6", "gcsfs>=2026.6"]    # gs:// I/O
azure = ["fsspec>=2026.6", "adlfs>=2026.5"]  # az:// I/O
torch = ["torch>=2.13"]           # PyTorch ShardDataset over a curated dataset (kuration.core.torch)
hf = ["datasets>=5.0.1"]           # HuggingFace datasets input adapter
zarr = ["zarr>=2.17"]             # Zarr array-store input adapter
video = ["av>=12"]                # optional CPU MP4 provider
ray = ["ray>=2.56.1"]             # optional distributed execution backend
stats = ["matplotlib>=3.8"]        # optional plotting for StatsReport.plot()
p2p = ["protobuf>=5.29.6"]        # Open P2P worked example (annotation.proto parsing)
cli = ["jsonschema>=4.21"]        # kur-validate --json-schema (JSON Schema cross-check)
pixel-shift = ["opencv-python>=4.9"]  # DIAMOND action-aligned optical-flow operator
action-state = ["opencv-python>=4.9"] # pixel-shift-backed consistency analyzer
collision = ["trimesh>=4", "rtree>=1.0"]  # CS2 wall-collision raycast operator/analyzer
slam = [
    "av>=12",
    "torch>=2.13",
    "torchvision>=0.28",
    "huggingface_hub>=0.25",
    "omegaconf>=2.3",
    "addict>=2.4",
    "einops>=0.7",
    "opencv-python>=4.9",
    "imageio>=2.31",
    "tqdm>=4.66.3",
    "pillow>=13.0",
    "safetensors>=0.4",
    "faiss-cpu>=1.8",
]                                  # gameplay SLAM + vendored Depth Anything 3
slam-viz = ["trimesh>=4"]          # kuration.gameplay.slam notebook viewer
gameplay = [
    "av>=12",
    "torch>=2.13",
    "torchvision>=0.28",
    "huggingface_hub>=0.25",
    "omegaconf>=2.3",
    "addict>=2.4",
    "einops>=0.7",
    "opencv-python>=4.9",
    "imageio>=2.31",
    "tqdm>=4.66.3",
    "pillow>=13.0",
    "safetensors>=0.4",
    "faiss-cpu>=1.8",
    "trimesh>=4",
    "rtree>=1.0",
]                                  # every built-in gameplay capability and visualization runtime
standard-operators = [
    "av>=12",
    "torch>=2.13",
    "torchvision>=0.28",
    "huggingface_hub>=0.25",
    "omegaconf>=2.3",
    "addict>=2.4",
    "einops>=0.7",
    "opencv-python>=4.9",
    "imageio>=2.31",
    "tqdm>=4.66.3",
    "pillow>=13.0",
    "safetensors>=0.4",
    "faiss-cpu>=1.8",
    "trimesh>=4",
    "rtree>=1.0",
]                                  # compatibility alias for the gameplay extra
all = [
    "scikit-learn>=1.5",
    "pyarrow>=23.0.1",
    "h5py>=3.10",
    "fsspec>=2026.6",
    "s3fs>=2026.6",
    "gcsfs>=2026.6",
    "adlfs>=2026.5",
    "torch>=2.13",
    "datasets>=5.0.1",
    "zarr>=2.17",
    "protobuf>=5.29.6",
    "jsonschema>=4.21",
    "av>=12",
    "ray>=2.56.1",
    "matplotlib>=3.8",
    "torchvision>=0.28",
    "huggingface_hub>=0.25",
    "omegaconf>=2.3",
    "addict>=2.4",
    "einops>=0.7",
    "opencv-python>=4.9",
    "imageio>=2.31",
    "tqdm>=4.66.3",
    "pillow>=13.0",
    "safetensors>=0.4",
    "faiss-cpu>=1.8",
    "trimesh>=4",
    "rtree>=1.0",
]                                   # every runtime capability and cloud backend in one install
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "jsonschema>=4.21",
    "ruff>=0.5",
    "mypy>=1.10",
    "build>=1.5,<2",
    "twine>=6.2,<8",
    "check-wheel-contents>=0.6.3,<1",
]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5"]

[project.scripts]
kur = "kuration.core.cli.main:main"
kur-curate = "kuration.core.cli.curate:main"
kur-experiment = "kuration.core.cli.experiment:main"
kur-report = "kuration.core.cli.report:main"
kur-validate = "kuration.core.cli.validate:main"
kur-list = "kuration.core.cli.discovery:list_main"
kur-describe = "kuration.core.cli.discovery:describe_main"
kur-migrate = "kuration.core.cli.migrate:main"
kur-explain = "kuration.core.cli.explain:main"
kur-inspect = "kuration.core.cli.inspect:main"
kur-diff = "kuration.core.cli.diff:main"
kur-check = "kuration.core.cli.check:main"
kur-import = "kuration.core.cli.import_dataset:main"
kur-plugin-check = "kuration.core.cli.plugin_check:main"
kur-infer = "kuration.core.cli.infer_schema_cli:main"
kur-init = "kuration.core.cli.init_job:main"
kur-preview = "kuration.core.cli.preview:main"
kur-stats = "kuration.core.cli.stats:main"
kur-export = "kuration.core.cli.export:main"
kur-checkpoint = "kuration.core.cli.checkpoint:main"
kur-slam = "kuration.gameplay.slam.cli:main"

[project.entry-points."kuration.plugins"]
gameplay = "kuration.gameplay:register"
selection = "kuration.selection:register"

[build-system]
requires = ["setuptools>=80,<84"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["kuration", "kuration.*"]

[tool.setuptools.package-data]
kuration = ["py.typed"]
"kuration.core" = ["schemas/*.json"]
"kuration.sample_data" = ["sessions/*.parquet"]
"kuration.gameplay.slam._vendor.depth_anything_3" = [
    "configs/*.yaml",
    "LICENSE",
    "NOTICE",
]

# Upstream exposes mono and metric preset names whose current YAML payloads are identical.
# Both identifiers remain valid runtime choices, so retain both files and only suppress W002.
[tool.check-wheel-contents]
ignore = ["W002"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["E731", "E741", "B007", "B008", "B023", "B904", "B905"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E401", "E402", "E731", "F401"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

# The optional Torch/DA3 numerical kernel and the private Depth Anything 3 source snapshot are
# exercised through focused integration and compatibility tests. Keep aggregate coverage focused
# on Kuration-owned adapters, execution boundaries, manifests, transforms, CLI, curation, and
# validation layers rather than treating vendored upstream implementation lines as SDK debt.
[tool.coverage.run]
omit = [
    "src/kuration/gameplay/slam/_runtime.py",
    "src/kuration/gameplay/slam/_vendor/**",
]

[tool.mypy]
python_version = "3.11"
files = ["src/kuration"]
exclude = ["^src/kuration/gameplay/slam/_vendor/"]
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = false
warn_unused_configs = true
warn_redundant_casts = true
warn_unreachable = true
strict_equality = true
follow_imports_for_stubs = true

# Depth Anything is vendored third-party runtime code. Kuration-owned adapters and orchestration
# around it are type-checked; the upstream implementation is validated through integration tests.

# Optional libraries may ship interpreter-specific stubs using that interpreter's syntax
# (for example PEP 695 `type` statements in NumPy or Zarr).  We intentionally
# type-check kuration against its minimum Python 3.11 while CI runs under 3.11-3.13, so
# parsing the host wheel's stubs can fail before our code is checked.  Keep them as
# external typed boundaries; every kuration module is still passed to mypy via `files`.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*", "zarr"]
follow_imports = "skip"
