[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kuration-ai"
version = "0.0.1"
description = "Curated training-dataset selection for Python."
requires-python = ">=3.11"
license = "Apache-2.0"
# authors: pending the same corporate decision tracked for kuration-sdk's own
# pyproject.toml — do not invent a name here.

# scikit-learn and pyarrow are pulled transitively via kuration-sdk extras so
# every operation in the gallery works out of the box on `pip install kuration-ai`.
dependencies = ["kuration-sdk[methods,parquet]>=0.1.0rc5.dev0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
kai = "kuration_ai.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kuration_ai"]
